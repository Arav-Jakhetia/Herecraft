plugins {
    id 'java'
    id 'application'
}

group = 'net.herecraft'
version = '1.0'

ext {
    lwjglVersion = '3.4.3'
    lwjglNatives = 'natives-windows'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-glfw'
    implementation 'org.lwjgl:lwjgl-stb'
    implementation 'org.lwjgl:lwjgl-vulkan'
    implementation 'org.lwjgl:lwjgl-shaderc'
    implementation 'org.lwjgl:lwjgl-sdl'

    implementation 'org.joml:joml:1.10.5'
    implementation 'org.jspecify:jspecify:1.0.1'
    implementation 'com.google.guava:guava:33.4.8-jre'
    implementation 'it.unimi.dsi:fastutil:8.5.15'
    implementation 'org.slf4j:slf4j-api:2.0.17'
    implementation 'org.apache.commons:commons-lang3:3.21.0'

    runtimeOnly "org.lwjgl:lwjgl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-stb::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-shaderc::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-sdl::$lwjglNatives"
}

sourceSets {
    main {
        java {
            exclude 'com/here/blaze3d/platform/InputConstants.java'
            exclude 'net/herecraft/client/input/CharacterEvent.java'
            exclude 'net/herecraft/client/input/InputQuirks.java'
            exclude 'net/herecraft/client/input/InputWithModifiers.java'
            exclude 'net/herecraft/client/input/KeyEvent.java'
            exclude 'net/herecraft/client/input/MouseButtonEvent.java'
            exclude 'net/herecraft/client/input/MouseButtonInfo.java'
            exclude 'net/herecraft/client/input/PreeditEvent.java'
            exclude 'net/herecraft/util/StringUtil.java'
            exclude 'net/herecraft/util/Util.java'
        }
    }
}

application {
    mainClass = 'net.herecraft.client.main.Main'
}
